name: optional-device-smoke
on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: Absolute path to a fully provisioned debug APK on the self-hosted device runner
        required: true
        type: string
      adb_serial:
        description: Optional adb serial when multiple devices are attached
        required: false
        type: string

jobs:
  p1-device-smoke:
    runs-on: [self-hosted, linux, arm64, android-device]
    steps:
      - uses: actions/checkout@v4
      - name: Install provided APK and run fresh P1 acceptance
        env:
          APK_PATH: ${{ inputs.apk_path }}
          ADB_SERIAL: ${{ inputs.adb_serial }}
        run: |
          test -s "$APK_PATH"
          if [[ -n "$ADB_SERIAL" ]]; then
            adb -s "$ADB_SERIAL" install -r "$APK_PATH"
            ./scripts/adb_smoke_p1.sh "$ADB_SERIAL"
          else
            adb install -r "$APK_PATH"
            ./scripts/adb_smoke_p1.sh
          fi
