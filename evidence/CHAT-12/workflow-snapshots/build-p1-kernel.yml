name: build-p1-kernel
on:
  workflow_dispatch:
  push:
    paths:
      - config/toolchain.lock.json
      - scripts/build_p1_kernel.sh
      - .github/workflows/build-p1-kernel.yml

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM kernel build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make bc bison flex libssl-dev libelf-dev
      - name: Build pinned ARM64 P1 kernel
        run: ./scripts/build_p1_kernel.sh
      - name: Verify artifact
        run: |
          test -s app/src/main/assets/p1/Image
          file app/src/main/assets/p1/Image
          sha256sum app/src/main/assets/p1/Image
      - uses: actions/upload-artifact@v4
        with:
          name: p1-linux-arm64-Image
          path: app/src/main/assets/p1/Image
          if-no-files-found: error
