name: source-checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-syntax-and-reproducibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Shell, Python, XML, YAML, invariants and release guards
        run: ./scripts/ci_source_checks.sh

  pure-kotlin-jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: P2/P3 pure topology smoke
        run: gradle --no-daemon :host-tests:p3PureSmoke

  fake-rfb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fake RFB integration smoke
        run: gradle --no-daemon :host-tests:fakeRfbSmoke

  qemu-dependency-closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ELF verifier
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Verify imported QEMU closure when present
        run: ./scripts/ci_verify_qemu_runtime.sh
