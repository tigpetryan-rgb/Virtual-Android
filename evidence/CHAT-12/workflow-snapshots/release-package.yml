name: release-package
on:
  workflow_dispatch:

jobs:
  deterministic-source-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install pinned YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify source and host JVM gates
        run: |
          ./scripts/ci_source_checks.sh
          gradle --no-daemon :host-tests:runHostSmokes
      - name: Build the release twice and compare bytes
        run: |
          python3 scripts/package_release.py --output dist/release-a.zip
          python3 scripts/package_release.py --output dist/release-b.zip
          cmp dist/release-a.zip dist/release-b.zip
          mv dist/release-a.zip dist/virtual-android-prototype-v0.7-ci-reproducible.zip
          rm dist/release-b.zip
          sha256sum dist/virtual-android-prototype-v0.7-ci-reproducible.zip
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-android-reproducible-source-release
          path: |
            dist/virtual-android-prototype-v0.7-ci-reproducible.zip
            release/release-manifest.json
          if-no-files-found: error
