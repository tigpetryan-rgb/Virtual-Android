name: g1-chat12-local-crc-solver

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve-local-edits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact local Base64 edits using ZIP CRCs
        shell: bash
        env:
          EXPECTED_SHA256: fdf40b01bc1dd3cc68b39fa118aab9b312683756126df63c25b71bce15d086a1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, binascii, hashlib, io, os, struct, zipfile, zlib
          from pathlib import Path

          EXPECTED=os.environ['EXPECTED_SHA256']
          ALPH='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          LH=b'PK\x03\x04'; CD=b'PK\x01\x02'; EOCD=b'PK\x05\x06'
          def txt(p): return ''.join(Path(p).read_text().split())
          parts={int(x.stem):txt(x) for x in Path('baseline/parts').glob('*.b64')}
          repairs={x.stem:txt(x) for x in Path('baseline/repair').glob('*.b64')}

          # Previously proven same-length repairs.
          for i in (1,2,3): parts[i]=parts[i][:10000]+repairs[f'{i:03d}1']
          s=''.join(parts[i] for i in sorted(parts))

          # Previously proven structural repairs from per-entry CRC solving.
          assert s[96995]=='i'
          s=s[:96995]+s[96996:]
          s=s[:120000]+'3'+s[120000:]
          s=s[:140000]+'l'+s[140000:]
          assert len(s)==175004

          def dec(text): return base64.b64decode(text,validate=True)
          def parse_header(raw,pos):
              if pos+30>len(raw) or raw[pos:pos+4]!=LH: return None
              sig,ver,flags,method,mt,md,crc,csize,usize,nlen,xlen=struct.unpack_from('<IHHHHHIIIHH',raw,pos)
              hs=pos; ns=pos+30; ds=ns+nlen+xlen; de=ds+csize
              name=raw[ns:ns+nlen].decode('utf-8','replace')
              return dict(hs=hs,ds=ds,de=de,flags=flags,method=method,crc=crc,csize=csize,usize=usize,name=name)
          def verify_entry(raw,h):
              if h['flags'] & 0x08: return False,'data-descriptor'
              if h['de']>len(raw): return False,'truncated-data'
              comp=raw[h['ds']:h['de']]
              try:
                  if h['method']==0: out=comp
                  elif h['method']==8: out=zlib.decompress(comp,-15)
                  else: return False,f"method-{h['method']}"
              except Exception as e: return False,f'deflate:{type(e).__name__}:{e}'
              if len(out)!=h['usize']: return False,f"usize:{len(out)}!={h['usize']}"
              crc=binascii.crc32(out)&0xffffffff
              if crc!=h['crc']: return False,f"crc:{crc:08x}!={h['crc']:08x}"
              return True,'ok'
          def first_bad(text):
              raw=dec(text); pos=0; good=0; last=None
              while True:
                  if pos+4>len(raw): return dict(kind='eof',good=good,pos=pos,last=last)
                  sig=raw[pos:pos+4]
                  if sig in (CD,EOCD): return dict(kind='central',good=good,pos=pos,last=last)
                  h=parse_header(raw,pos)
                  if not h: return dict(kind='signature',good=good,pos=pos,last=last,sig=sig.hex())
                  ok,why=verify_entry(raw,h)
                  if not ok: return dict(kind='entry',good=good,pos=pos,last=last,bad=h,why=why)
                  good+=1; last=h; pos=h['de']
          def b64_cover(h): return 4*(h['hs']//3),4*((h['de']+2)//3)
          def verify_candidate_segment(seg,global_cs,h):
              if len(seg)%4: return False
              try: raw=base64.b64decode(seg,validate=True)
              except Exception: return False
              raw0=3*(global_cs//4); lhs=h['hs']-raw0
              if lhs<0 or raw[lhs:lhs+4]!=LH: return False
              hh=parse_header(raw,lhs)
              if not hh: return False
              for k in ('method','crc','csize','usize','flags'):
                  if hh[k]!=h[k]: return False
              return verify_entry(raw,hh)[0]

          replacements=[]
          for round_no in range(1,21):
              fb=first_bad(s)
              print('ROUND',round_no,fb)
              if fb['kind']=='central': break
              if fb['kind']!='entry': raise SystemExit(f'Non-entry corruption requires separate handling: {fb}')
              h=fb['bad']; cs,ce=b64_cover(h); seg=s[cs:ce]
              sols=[]
              for rel,old in enumerate(seg):
                  for ch in ALPH:
                      if ch==old: continue
                      cand=seg[:rel]+ch+seg[rel+1:]
                      if verify_candidate_segment(cand,cs,h): sols.append((cs+rel,old,ch))
              print('REPLACE_CANDIDATES',sols[:100],'count=',len(sols),'entry=',h['name'],'window=',(cs,ce))
              if len(sols)!=1: raise SystemExit(f'Expected one single-character replacement, got {len(sols)}')
              pos,old,new=sols[0]
              s=s[:pos]+new+s[pos+1:]
              replacements.append((pos,old,new,h['name']))
              print('APPLY_REPLACE global=',pos,'old=',old,'new=',new,'entry=',h['name'])
          else:
              raise SystemExit('Replacement iteration limit exceeded')

          fb=first_bad(s)
          print('LOCAL_FINAL',fb)
          raw=dec(s)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              bad=z.testzip(); names=z.namelist()
              print('ZIP entries=',len(names),'testzip=',bad)
              if bad is not None: raise SystemExit(f'zipfile CRC failure remains: {bad}')
          sha=hashlib.sha256(raw).hexdigest()
          print('REPLACEMENTS',replacements)
          print('FINAL chars=',len(s),'bytes=',len(raw),'sha256=',sha)
          if sha!=EXPECTED: raise SystemExit(f'Fully local-CRC-valid ZIP hash {sha} != required {EXPECTED}')
          print('TARGET_MATCH',EXPECTED)
          PY
