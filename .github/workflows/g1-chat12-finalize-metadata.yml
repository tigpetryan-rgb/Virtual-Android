name: g1-chat12-finalize-metadata

on:
  pull_request:
  push:
    branches:
      - g1-chat12-finalize-metadata
    paths:
      - .github/workflows/g1-chat12-finalize-metadata.yml

permissions:
  contents: write

jobs:
  regenerate-finalization-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g1-chat12-finalize
          fetch-depth: 0
      - name: Generate metadata from exact finalization tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_metadata.py
          cp FILELIST.txt /tmp/FILELIST.txt
          cp release/release-manifest.json /tmp/release-manifest.json
      - name: Commit generated metadata to helper branch
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git fetch origin g1-chat12-finalize-metadata
          git checkout -B g1-chat12-finalize-metadata origin/g1-chat12-finalize-metadata
          cp /tmp/FILELIST.txt FILELIST.txt
          cp /tmp/release-manifest.json release/release-manifest.json
          git config user.name 'virtual-android-metadata-helper'
          git config user.email 'virtual-android-metadata-helper@users.noreply.github.com'
          git add FILELIST.txt release/release-manifest.json
          git diff --cached --check
          git commit -m 'G1/CHAT-12: regenerate finalization metadata'
          git push origin HEAD:g1-chat12-finalize-metadata
