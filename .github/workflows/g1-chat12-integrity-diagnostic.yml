name: g1-chat12-integrity-diagnostic

on:
  push:
    paths:
      - '.github/workflows/g1-chat12-integrity-diagnostic.yml'
      - 'baseline/parts/**'
      - 'baseline/repair/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose staged CHAT-12 source and repair candidates
        shell: bash
        env:
          EXPECTED_SHA256: fdf40b01bc1dd3cc68b39fa118aab9b312683756126df63c25b71bce15d086a1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import itertools
          import os
          from pathlib import Path

          expected = os.environ['EXPECTED_SHA256']
          parts_dir = Path('baseline/parts')
          repair_dir = Path('baseline/repair')

          def read_text(path: Path) -> str:
              return ''.join(path.read_text(encoding='utf-8').split())

          parts = {int(p.stem): read_text(p) for p in sorted(parts_dir.glob('*.b64'))}
          repairs = {p.stem: read_text(p) for p in sorted(repair_dir.glob('*.b64'))}

          print('PARTS')
          for i, text in sorted(parts.items()):
              print(f'part {i:03d}: chars={len(text)} text_sha256={hashlib.sha256(text.encode()).hexdigest()}')

          print('REPAIRS')
          for name, text in sorted(repairs.items()):
              print(f'repair {name}: chars={len(text)} text_sha256={hashlib.sha256(text.encode()).hexdigest()}')

          def decode_hash(part_map):
              b64 = ''.join(part_map[i] for i in sorted(part_map))
              try:
                  raw = base64.b64decode(b64, validate=True)
              except Exception as exc:
                  return None, None, f'{type(exc).__name__}: {exc}'
              return hashlib.sha256(raw).hexdigest(), len(raw), None

          raw_sha, raw_len, raw_err = decode_hash(parts)
          print(f'CURRENT decoded_len={raw_len} sha256={raw_sha} error={raw_err}')

          for i in range(1, 5):
              original = parts.get(i)
              r0 = repairs.get(f'{i:03d}0')
              r1 = repairs.get(f'{i:03d}1')
              if original is None:
                  continue
              print(f'ALIGN part={i:03d}')
              for label, r in [('r0', r0), ('r1', r1)]:
                  if r is None:
                      print(f'  {label}: missing')
                      continue
                  print(f'  {label}: find={original.find(r)} prefix={original.startswith(r)} suffix={original.endswith(r)}')
              if r0 is not None and r1 is not None:
                  print(f'  r0_eq_r1={r0 == r1} concat_len={len(r0)+len(r1)} original_len={len(original)}')

          def options_for(i):
              original = parts[i]
              r0 = repairs.get(f'{i:03d}0')
              r1 = repairs.get(f'{i:03d}1')
              opts = [('orig', original)]
              if r0 is not None:
                  opts.append(('prefix0', r0 + original[len(r0):]))
                  if len(original) >= 10000 + len(r0):
                      opts.append(('slot0', original[:10000] + r0 + original[10000+len(r0):]))
              if r1 is not None:
                  opts.append(('suffix1', original[:-len(r1)] + r1 if len(r1) <= len(original) else r1))
                  if len(original) >= 10000:
                      opts.append(('slot1', original[:10000] + r1 + original[10000+len(r1):]))
              if r0 is not None and r1 is not None:
                  opts.append(('concat01', r0 + r1))
                  if len(r0) + len(r1) <= len(original):
                      opts.append(('ends01', r0 + original[len(r0):len(original)-len(r1)] + r1))
                  # Treat repair names as first/second 10k half payloads, preserving uncovered bytes.
                  first = original[:10000]
                  second = original[10000:]
                  first_overlay = r0 + first[len(r0):] if len(r0) <= len(first) else r0
                  second_overlay = r1 + second[len(r1):] if len(r1) <= len(second) else r1
                  opts.append(('halves_overlay', first_overlay + second_overlay))
              dedup = []
              seen = set()
              for name, value in opts:
                  key = hashlib.sha256(value.encode()).digest()
                  if key not in seen:
                      seen.add(key)
                      dedup.append((name, value))
              return dedup

          target_parts = [i for i in range(1, 5) if i in parts]
          option_sets = [options_for(i) for i in target_parts]
          print('SEARCH_COUNTS', {i: len(opts) for i, opts in zip(target_parts, option_sets)})

          checked = 0
          decode_ok = 0
          matches = []
          observed = []
          for combo in itertools.product(*option_sets):
              candidate = dict(parts)
              recipe = []
              for i, (name, value) in zip(target_parts, combo):
                  candidate[i] = value
                  recipe.append(f'{i:03d}:{name}')
              sha, nbytes, err = decode_hash(candidate)
              checked += 1
              if sha is not None:
                  decode_ok += 1
                  if len(observed) < 20:
                      observed.append((sha, nbytes, ','.join(recipe)))
                  if sha == expected:
                      matches.append((recipe, nbytes))

          print(f'SEARCH checked={checked} decode_ok={decode_ok} target_matches={len(matches)}')
          for sha, nbytes, recipe in observed:
              print(f'OBSERVED sha256={sha} decoded_len={nbytes} recipe={recipe}')
          for recipe, nbytes in matches:
              print(f'TARGET_MATCH decoded_len={nbytes} recipe={",".join(recipe)}')

          if not matches:
              raise SystemExit(f'No candidate reconstructed the required SHA-256 {expected}')
          PY
