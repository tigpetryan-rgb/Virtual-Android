name: g1-chat12-boundary-solver

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Solve known substitutions and chunk-boundary length errors
        shell: bash
        env:
          EXPECTED_SHA256: fdf40b01bc1dd3cc68b39fa118aab9b312683756126df63c25b71bce15d086a1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path

          expected=os.environ['EXPECTED_SHA256']
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          def txt(p): return ''.join(Path(p).read_text().split())
          p={int(x.stem):txt(x) for x in Path('baseline/parts').glob('*.b64')}
          r={x.stem:txt(x) for x in Path('baseline/repair').glob('*.b64')}

          # Apply the evidence-backed same-length corrections first.
          for i in (1,2,3):
              rr=r[f'{i:03d}1']
              assert len(rr)==10000
              p[i]=p[i][:10000]+rr

          print('PATCHED_HASHES')
          for i in (1,2,3): print(i, len(p[i]), hashlib.sha256(p[i].encode()).hexdigest())

          # Length evidence: 004 has +1 char, 006 and 007 each have -1 char.
          # First test the natural chunk-boundary hypotheses only.
          del_positions=sorted(set([10000, len(p[4])-1]))
          ins6_positions=sorted(set([0, len(p[6])]))
          ins7_positions=sorted(set([0, len(p[7])]))
          checked=0
          for dp in del_positions:
              q4=p[4][:dp]+p[4][dp+1:]
              for pos6 in ins6_positions:
                  for c6 in alphabet:
                      q6=p[6][:pos6]+c6+p[6][pos6:]
                      for pos7 in ins7_positions:
                          prefix=''.join(p[i] if i not in (4,6,7) else ({4:q4,6:q6}[i] if i in (4,6) else '') for i in range(8))
                          for c7 in alphabet:
                              q7=p[7][:pos7]+c7+p[7][pos7:]
                              stream=''.join([p[0],p[1],p[2],p[3],q4,p[5],q6,q7,p[8]])
                              checked+=1
                              try: raw=base64.b64decode(stream,validate=True)
                              except Exception: continue
                              sha=hashlib.sha256(raw).hexdigest()
                              if sha==expected:
                                  print(f'TARGET_MATCH delete4={dp} insert6={pos6}:{c6} insert7={pos7}:{c7} chars={len(stream)} bytes={len(raw)}')
                                  raise SystemExit(0)
          print('CHECKED',checked,'NO_TARGET')
          raise SystemExit('Boundary-only hypotheses did not reconstruct target SHA')
          PY
