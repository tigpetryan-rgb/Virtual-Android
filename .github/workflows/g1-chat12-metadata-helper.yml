name: g1-chat12-metadata-helper

on:
  push:
    branches:
      - g1-chat12-metadata-helper
    paths:
      - .github/workflows/g1-chat12-metadata-helper.yml

permissions:
  contents: write

jobs:
  regenerate-main-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate metadata from canonical main
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_metadata.py
          cp FILELIST.txt /tmp/FILELIST.txt
          cp release/release-manifest.json /tmp/release-manifest.json
      - name: Commit generated metadata to helper branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin g1-chat12-metadata-helper
          git checkout -B g1-chat12-metadata-helper origin/g1-chat12-metadata-helper
          cp /tmp/FILELIST.txt FILELIST.txt
          cp /tmp/release-manifest.json release/release-manifest.json
          git config user.name 'virtual-android-metadata-helper'
          git config user.email 'virtual-android-metadata-helper@users.noreply.github.com'
          git add FILELIST.txt release/release-manifest.json
          git diff --cached --check
          git commit -m 'G1/CHAT-12: regenerate canonical release metadata'
          git push origin HEAD:g1-chat12-metadata-helper
